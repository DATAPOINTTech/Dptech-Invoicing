{% extends "base.html" %}
{% block title %}Invoices - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-6">
        <div class="flex justify-between items-center mb-5">
            <div>
                <h1 class="page-title">Sales Invoices</h1>
            </div>
            <a href="/invoices/new" class="btn btn-success"><i class="fas fa-plus"></i> New Invoice</a>
        </div>
        <div class="card overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-100 flex flex-wrap gap-3 items-center justify-between">
                <div class="flex items-center gap-3">
                    <select id="status-filter" class="px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500">
                        <option value="">All Status</option>
                        <option value="draft">Draft</option>
                        <option value="approved">Approved</option>
                        <option value="sent">Sent</option>
                        <option value="paid">Paid</option>
                        <option value="partially_paid">Partially Paid</option>
                        <option value="overdue">Overdue</option>
                        <option value="fbr_posted">FBR: Posted</option>
                        <option value="fbr_unposted">FBR: Unposted</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 flex-1 max-w-md justify-end">
                    <div class="relative w-full">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="invoice-search" placeholder="Search by Inv #, Estimation Name / Title, Est #, Client..." class="w-full pl-8 pr-8 py-2 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 bg-white transition-all shadow-2xs">
                        <button type="button" id="btn-clear-invoice-search" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs" title="Clear search">
                            <i class="fas fa-times-circle"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="table-container">
            <table class="data-table"><thead><tr><th>Invoice #</th><th>Client</th><th>Project / Purpose</th><th>Date</th><th class="text-right">Total</th><th class="text-right">Balance</th><th class="text-center">Status</th><th class="text-center">FBR Portal</th><th class="text-right">Actions</th></tr></thead><tbody id="invoices-body"></tbody></table>
            </div>
        </div>
    </main>
</div>
<script>
const token=localStorage.getItem('token');if(!token)window.location.href='/login';
let cachedInvoices = [];

function renderInvoices() {
    const q = ($('#invoice-search').val() || '').toLowerCase().trim();
    if (q) {
        $('#btn-clear-invoice-search').removeClass('hidden');
    } else {
        $('#btn-clear-invoice-search').addClass('hidden');
    }

    let invs = cachedInvoices;
    if (q) {
        invs = invs.filter(i =>
            (i.invoice_no && i.invoice_no.toLowerCase().includes(q)) ||
            (i.linked_estimate_no && i.linked_estimate_no.toLowerCase().includes(q)) ||
            (i.linked_estimate_title && i.linked_estimate_title.toLowerCase().includes(q)) ||
            (i.client_name && i.client_name.toLowerCase().includes(q)) ||
            (i.project_name && i.project_name.toLowerCase().includes(q)) ||
            (i.project_description && i.project_description.toLowerCase().includes(q)) ||
            (i.title && i.title.toLowerCase().includes(q))
        );
    }
    const statusBadge=s=>{const m={paid:'badge-green',approved:'badge-blue',sent:'badge-blue',overdue:'badge-red',partially_paid:'badge-amber',draft:'badge-gray',cancelled:'badge-red'};return `<span class="badge ${m[s]||'badge-gray'}">${escHtml((s||'draft').replace('_',' '))}</span>`;};
    const fbrBadge=(st,fbrNo)=>{
        if(st==='posted'&&fbrNo){return `<span class="badge badge-green" title="FBR Invoice #: ${escHtml(fbrNo)}"><i class="fas fa-check-circle mr-1"></i>Posted</span>`;}
        if(st==='failed'){return `<span class="badge badge-red" title="FBR Submission Failed"><i class="fas fa-exclamation-circle mr-1"></i>Failed</span>`;}
        return `<span class="badge badge-gray"><i class="far fa-clock mr-1"></i>Unposted</span>`;
    };
    if(!invs.length){$('#invoices-body').html('<tr><td colspan="9" class="text-center py-8 text-slate-400">No invoices found</td></tr>');return;}
    $('#invoices-body').html(invs.map(i=>{
        let purposeHtml = '';
        if (i.project_description) {
            purposeHtml = `
                <div>
                    ${i.project_name ? `<div class="text-[11px] font-bold text-cyan-800 flex items-center gap-1 mb-0.5"><i class="fas fa-project-diagram text-cyan-600"></i><span>${escHtml(i.project_name)}</span></div>` : ''}
                    <div class="text-xs text-slate-700 leading-snug font-medium line-clamp-2" title="${escHtml(i.project_description)}">${escHtml(i.project_description)}</div>
                    ${i.title && i.title !== i.project_name ? `<div class="text-[10px] text-slate-400 mt-0.5"><i class="fas fa-tag mr-0.5"></i>${escHtml(i.title)}</div>` : ''}
                </div>
            `;
        } else if (i.project_name) {
            purposeHtml = `
                <div>
                    <div class="text-xs font-bold text-cyan-800 flex items-center gap-1"><i class="fas fa-project-diagram text-cyan-600"></i><span>${escHtml(i.project_name)}</span></div>
                    ${i.title ? `<div class="text-[11px] text-slate-600 mt-0.5">${escHtml(i.title)}</div>` : ''}
                </div>
            `;
        } else if (i.title) {
            purposeHtml = `
                <div class="text-xs text-slate-700 font-medium flex items-center gap-1">
                    <i class="fas fa-file-invoice text-slate-400"></i>
                    <span>${escHtml(i.title)}</span>
                </div>
            `;
        } else {
            purposeHtml = `<span class="text-xs text-slate-400 italic">General Sales</span>`;
        }

        return `<tr>
            <td class="font-medium text-slate-800">${escHtml(i.invoice_no)}</td>
            <td class="font-semibold text-slate-800 whitespace-nowrap">${escHtml(i.client_name || '-')}</td>
            <td class="max-w-xs">${purposeHtml}</td>
            <td class="text-slate-500 whitespace-nowrap">${escHtml(i.invoice_date || '-')}</td>
            <td class="text-right font-medium">${escHtml(i.currency || 'PKR')} ${Number(i.total_amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td class="text-right ${Number(i.balance_due || 0)>0?'text-red-600 font-semibold':'text-green-600'}">${escHtml(i.currency || 'PKR')} ${Number(i.balance_due || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td class="text-center">${statusBadge(i.status)}</td>
            <td class="text-center">${fbrBadge(i.fbr_status, i.fbr_invoice_no)}</td>
            <td class="text-right">
                <div class="flex gap-2 justify-end items-center">
                ${i.estimate_id 
                    ? `<a href="/estimates/${Number(i.estimate_id)}" class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 rounded-lg shadow-xs transition convert-to-estimate" data-id="${Number(i.id)}" data-no="${escHtml(i.invoice_no)}" data-estimate-id="${Number(i.estimate_id)}" data-estimate-no="${escHtml(i.linked_estimate_no || '')}" title="Estimate already created (${escHtml(i.linked_estimate_no || '#' + i.estimate_id)}). Click to view."><i class="fas fa-check-circle text-emerald-600"></i> Estimate ${escHtml(i.linked_estimate_no || 'Created')}</a>`
                    : `<button class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-300 rounded-lg shadow-xs transition convert-to-estimate" data-id="${Number(i.id)}" data-no="${escHtml(i.invoice_no)}" data-estimate-id="" data-estimate-no="" title="Convert invoice ${escHtml(i.invoice_no)} to Estimate"><i class="fas fa-file-invoice"></i> Convert to Estimate</button>`}
                <a href="/invoices/${Number(i.id)}" class="btn btn-ghost btn-sm" title="View"><i class="fas fa-eye"></i></a>
                <a href="/api/invoices/${Number(i.id)}/pdf?token=${encodeURIComponent(token)}" target="_blank" class="btn btn-ghost btn-sm text-red-500" title="PDF"><i class="fas fa-file-pdf"></i></a>
                <a href="/invoices/${Number(i.id)}/edit" class="btn btn-ghost btn-sm" title="Edit"><i class="fas fa-pen"></i></a>
                ${i.status==='cancelled'
                    ? `<button class="btn btn-ghost btn-sm text-red-500 delete-invoice" data-id="${Number(i.id)}" data-no="${escHtml(i.invoice_no)}" title="Delete"><i class="fas fa-trash"></i></button>`
                    : `<button class="btn btn-ghost btn-sm text-red-500 cancel-invoice" data-id="${Number(i.id)}" data-no="${escHtml(i.invoice_no)}" title="Cancel"><i class="fas fa-times"></i></button>`}
                </div>
            </td>
        </tr>`;
    }).join(''));
}

function load(){
    const s=$('#status-filter').val();
    $.ajax({url:'/api/invoices'+(s?'?status='+s:''),method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(invs){
        cachedInvoices = Array.isArray(invs) ? invs : [];
        renderInvoices();
    }).fail(function(x){
        if(x.status===401){localStorage.removeItem('token');window.location.href='/login';}
        $('#invoices-body').html('<tr><td colspan="9" class="text-center py-8 text-red-400">Error: '+escHtml(x.responseJSON?.detail||'Failed to load invoices')+'</td></tr>');
    });
}
$(document).on('click', '.convert-to-estimate', function(e){
    e.preventDefault();
    const id=$(this).data('id'), no=$(this).data('no');
    const estId=$(this).data('estimate-id'), estNo=$(this).data('estimate-no');

    if (estId) {
        const displayEst = estNo ? (' (' + estNo + ')') : (' (#' + estId + ')');
        alert('Estimate already created' + displayEst + '. No duplicate estimate should be converted.');
        if (confirm('Estimate already created' + displayEst + '. Would you like to view it now?')) {
            window.location.href = '/estimates/' + estId;
        }
        return;
    }

    if(!confirm('Convert invoice '+no+' to a new estimate / quotation?')) return;
    const btn = $(this);
    btn.prop('disabled', true);
    $.ajax({
        url:'/api/invoices/'+id+'/convert',
        method:'POST',
        headers:{Authorization:'Bearer '+token}
    }).done(function(res){
        alert(res.message || ('Invoice converted to Estimate #' + res.estimate_no));
        window.location.href = '/estimates/' + res.estimate_id;
    }).fail(function(x){
        btn.prop('disabled', false);
        if (x.status === 400 && x.responseJSON?.estimate_already_created) {
            const eNo = x.responseJSON.estimate_no ? (' (' + x.responseJSON.estimate_no + ')') : '';
            alert('Estimate already created' + eNo + '. No duplicate estimate should be converted.');
            if (x.responseJSON.estimate_id && confirm('Estimate already created' + eNo + '. Would you like to open it now?')) {
                window.location.href = '/estimates/' + x.responseJSON.estimate_id;
            }
            return;
        }
        alert('Failed to convert: ' + (x.responseJSON?.detail || 'Error'));
    });
});
$(document).on('click', '.cancel-invoice', function(e){
    e.preventDefault();
    const id=$(this).data('id'), no=$(this).data('no');
    if(confirm('Cancel invoice '+no+'?')){
        $.ajax({url:'/api/invoices/'+id,method:'DELETE',headers:{Authorization:'Bearer '+token}}).done(function(){load();}).fail(function(x){alert(x.responseJSON?.detail||'Error');});
    }
});
$(document).on('click', '.delete-invoice', function(e){
    e.preventDefault();
    const id=$(this).data('id'), no=$(this).data('no');
    if(confirm('Permanently delete cancelled invoice '+no+'? This cannot be undone.')){
        $.ajax({url:'/api/invoices/'+id+'/delete',method:'DELETE',headers:{Authorization:'Bearer '+token}}).done(function(){load();}).fail(function(x){alert(x.responseJSON?.detail||'Error');});
    }
});
$(function(){
    // Check initial search param from URL if any
    const urlQ = new URLSearchParams(window.location.search).get('search') || new URLSearchParams(window.location.search).get('q') || '';
    if (urlQ) {
        $('#invoice-search').val(urlQ);
    }
    load();
    $('#status-filter').on('change', load);
    $('#invoice-search').on('input', renderInvoices);
    $('#btn-clear-invoice-search').on('click', function() {
        $('#invoice-search').val('').focus();
        renderInvoices();
    });
});
</script>
{% endblock %}
