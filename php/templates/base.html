<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ company }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
                    },
                    colors: {
                        sidebar: {
                            DEFAULT: '#090d16',
                            surface: '#0f172a',
                            hover: 'rgba(255, 255, 255, 0.06)',
                            active: '#4f46e5',
                            border: 'rgba(255, 255, 255, 0.08)'
                        },
                        brand: {
                            50:  '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                            950: '#1e1b4b'
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(15, 23, 42, 0.08)',
                        'card-modern': '0 1px 3px 0 rgba(15, 23, 42, 0.03), 0 4px 14px -2px rgba(15, 23, 42, 0.04)',
                        'card-hover': '0 12px 28px -4px rgba(79, 70, 229, 0.09), 0 4px 12px -2px rgba(15, 23, 42, 0.04)',
                        'glow-brand': '0 0 20px -3px rgba(79, 70, 229, 0.35)',
                        'glow-success': '0 0 20px -3px rgba(16, 185, 129, 0.35)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script>
        // Escape text before putting it into HTML built with template strings / .html().
        // Use escHtml(value) around EVERY piece of user-entered data (names, notes, emails, ...).
        window.escHtml = function (value) {
            return String(value === null || value === undefined ? '' : value).replace(/[&<>"'`]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c];
            });
        };
    </script>
    <script>
        (function() {
            var t = localStorage.getItem('token');
            if (t) {
                document.cookie = 'token=' + encodeURIComponent(t) + '; path=/; max-age=86400; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
                if (window.jQuery) {
                    $.ajaxSetup({
                        beforeSend: function(xhr) {
                            xhr.setRequestHeader('Authorization', 'Bearer ' + t);
                            xhr.setRequestHeader('X-Authorization', 'Bearer ' + t);
                        }
                    });
                }
            }
            if (window.jQuery) {
                $(document).ajaxError(function(event, jqXHR, ajaxSettings) {
                    if (jqXHR.status === 401 && !ajaxSettings.url.includes('/api/auth/login')) {
                        localStorage.removeItem('token');
                        document.cookie = 'token=; path=/; max-age=0';
                        window.location.href = '/login?expired=1';
                    }
                });
            }
        })();
    </script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-brand-500 selection:text-white">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
