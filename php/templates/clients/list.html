{% extends "base.html" %}
{% block title %}Clients - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Clients</h1>
            <a href="/clients/new" class="bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-cyan-700"><i class="fas fa-plus mr-2"></i>Add Client</a>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100"><input type="text" id="search" class="w-full md:w-96 px-4 py-2 border rounded-lg text-sm" placeholder="Search clients..." onkeyup="loadClients(this.value)"></div>
            <table class="w-full" id="clients-table"><thead class="bg-dptech-50"><tr><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Name</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Company</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Phone</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Email</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">City</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Actions</th></tr></thead><tbody id="clients-body"></tbody></table>
        </div>
    </main>
</div>
<script>
(function() {
    var token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; return; }

    function loadClients(search) {
        var url = '/api/clients';
        if (search) url = url + '?search=' + encodeURIComponent(search);

        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            if (xhr.status !== 200) {
                document.getElementById('clients-body').innerHTML =
                    '<tr><td colspan="6" class="text-center py-8 text-red-400">Error loading clients (status ' + xhr.status + ')</td></tr>';
                return;
            }
            var clients = JSON.parse(xhr.responseText);
            if (!clients || !clients.length) {
                document.getElementById('clients-body').innerHTML =
                    '<tr><td colspan="6" class="text-center py-8 text-gray-400">No clients found</td></tr>';
                return;
            }
            var html = '';
            for (var i = 0; i < clients.length; i++) {
                var c = clients[i];
                html += '<tr class="border-b border-gray-50 hover:bg-dptech-50">' +
                    '<td class="px-6 py-4 font-medium text-gray-800">' + (c.name || '') + '</td>' +
                    '<td class="px-6 py-4 text-gray-600">' + (c.company || '-') + '</td>' +
                    '<td class="px-6 py-4 text-gray-600">' + (c.phone || '-') + '</td>' +
                    '<td class="px-6 py-4 text-gray-600">' + (c.email || '-') + '</td>' +
                    '<td class="px-6 py-4 text-gray-600">' + (c.city || '-') + '</td>' +
                    '<td class="px-6 py-4 text-right">' +
                    '<a href="/clients/new?id=' + c.id + '" class="text-cyan-600 hover:text-cyan-800 mr-3"><i class="fas fa-edit"></i></a>' +
                    '<button onclick="deleteClient(' + c.id + ')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>' +
                    '</td></tr>';
            }
            document.getElementById('clients-body').innerHTML = html;
        };
        xhr.send();
    }

    function deleteClient(id) {
        if (!confirm('Delete this client?')) return;
        var xhr = new XMLHttpRequest();
        xhr.open('DELETE', '/api/clients/' + id, true);
        xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var searchVal = document.getElementById('search').value;
                loadClients(searchVal);
            }
        };
        xhr.send();
    }

    window.loadClients = loadClients;
    window.deleteClient = deleteClient;

    loadClients('');
})();
</script>
{% endblock %}
