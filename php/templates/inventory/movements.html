{% extends "base.html" %}
{% block title %}Stock Movements - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-6">
        <div class="flex justify-between items-center mb-5">
            <h1 class="text-2xl font-bold text-gray-800">Stock Movements</h1>
            <div class="flex gap-2">
                <select id="product-filter" class="px-3 py-2 border rounded-lg text-sm"><option value="">All Products</option></select>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full"><thead class="bg-dptech-50"><tr><th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Date</th><th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Product</th><th class="text-right px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Qty</th><th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Type</th><th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Reference</th><th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Notes</th><th class="text-center px-4 py-3 text-xs font-semibold text-gray-500 uppercase">Actions</th></tr></thead><tbody id="movements-body"></tbody></table>
        </div>
    </main>
</div>

<div id="edit-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"><div class="bg-white rounded-xl p-6 w-96">
    <h3 class="font-bold text-lg mb-4">Edit Stock Movement</h3>
    <form id="edit-form" class="space-y-3">
        <input type="hidden" id="edit-id">
        <div><label class="block text-sm text-gray-600">Quantity</label><input type="number" step="0.01" id="edit-qty" required class="w-full px-3 py-2 border rounded-lg text-sm"></div>
        <div><label class="block text-sm text-gray-600">Movement Type</label>
            <select id="edit-type" class="w-full px-3 py-2 border rounded-lg text-sm">
                <option value="purchase_in">Purchase In</option>
                <option value="sale_out">Sale Out</option>
                <option value="adjustment">Adjustment</option>
                <option value="return_in">Return In</option>
                <option value="return_out">Return Out</option>
                <option value="transfer">Transfer</option>
            </select>
        </div>
        <div><label class="block text-sm text-gray-600">Notes</label><textarea id="edit-notes" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm"></textarea></div>
        <div class="flex gap-2 pt-2"><button type="submit" class="bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Save</button><button type="button" onclick="hideEditModal()" class="bg-gray-100 px-4 py-2 rounded-lg text-sm">Cancel</button></div>
    </form>
</div></div>

<script>
const token=localStorage.getItem('token');if(!token)window.location.href='/login';

const typeLabels={purchase_in:{label:'Purchase In',cls:'badge-green'},sale_out:{label:'Sale Out',cls:'badge-red'},adjustment:{label:'Adjustment',cls:'badge-amber'},return_in:{label:'Return In',cls:'badge-blue'},return_out:{label:'Return Out',cls:'badge-amber'},transfer:{label:'Transfer',cls:'badge-purple'}};

function load(filterId){
    const url = filterId ? '/api/inventory/movements?product_id='+filterId : '/api/inventory/movements';
    $.ajax({url,method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(ms){
        if(!ms||!ms.length){$('#movements-body').html('<tr><td colspan="7" class="text-center py-8 text-gray-400">No movements recorded</td></tr>');return;}
        $('#movements-body').html(ms.map(m=>{
            const t = typeLabels[m.movement_type]||{label:m.movement_type,cls:'badge-gray'};
            return `<tr class="border-b border-gray-50 hover:bg-dptech-50">
                <td class="px-4 py-3 text-sm text-gray-500">${m.created_at ? new Date(m.created_at).toLocaleDateString() : '-'}</td>
                <td class="px-4 py-3 font-medium text-gray-800">${m.product_name}</td>
                <td class="px-4 py-3 text-right font-semibold ${m.quantity>0?'text-green-600':'text-red-600'}">${m.quantity>0?'+':''}${m.quantity}</td>
                <td class="px-4 py-3 text-center"><span class="badge ${t.cls} text-xs">${t.label}</span></td>
                <td class="px-4 py-3 text-sm text-gray-500">${m.reference_type ? m.reference_type + (m.reference_id ? ' #'+m.reference_id : '') : '-'}</td>
                <td class="px-4 py-3 text-sm text-gray-500 max-w-40 truncate">${m.notes||'-'}</td>
                <td class="px-4 py-3 text-center">
                    <div class="flex gap-2 justify-center">
                        <button class="text-amber-600 hover:text-amber-800 bg-transparent border-0 cursor-pointer edit-movement" data-id="${m.id}" data-qty="${m.quantity}" data-type="${m.movement_type}" data-notes="${(m.notes||'').replace(/"/g,'&quot;')}" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="text-red-600 hover:text-red-800 bg-transparent border-0 cursor-pointer delete-movement" data-id="${m.id}" data-product="${m.product_name}" title="Delete"><i class="fas fa-trash"></i></button>
                    </div>
                </td>
            </tr>`;
        }).join(''));
    }).fail(function(x){$('#movements-body').html('<tr><td colspan="7" class="text-center py-8 text-red-400">Failed to load: '+(x.statusText||'error')+'</td></tr>');});
}

function loadProducts(){
    $.ajax({url:'/api/products',method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(ps){
        var opts='<option value="">All Products</option>';
        ps.forEach(function(p){opts+='<option value="'+p.id+'">'+p.name+'</option>';});
        $('#product-filter').html(opts);
    });
}

function showEditModal(id,qty,type,notes){
    $('#edit-id').val(id);
    $('#edit-qty').val(qty);
    $('#edit-type').val(type);
    $('#edit-notes').val(notes);
    $('#edit-modal').removeClass('hidden').addClass('flex');
}
function hideEditModal(){$('#edit-modal').removeClass('flex').addClass('hidden');}

$(document).on('click','.edit-movement',function(){
    showEditModal($(this).data('id'),$(this).data('qty'),$(this).data('type'),$(this).data('notes'));
});

$(document).on('click','.delete-movement',function(){
    const id=$(this).data('id'),p=$(this).data('product');
    if(!confirm('Delete this stock movement for "'+p+'"? This will reverse the stock effect.'))return;
    $.ajax({url:'/api/inventory/movements/'+id,method:'DELETE',headers:{Authorization:'Bearer '+token}}).done(function(){load($('#product-filter').val());}).fail(function(x){alert('Error: '+(x.responseJSON?.detail||'Unknown'));});
});

$('#edit-form').submit(function(e){
    e.preventDefault();
    const id=$('#edit-id').val();
    const data={quantity:parseFloat($('#edit-qty').val()),movement_type:$('#edit-type').val(),notes:$('#edit-notes').val()};
    $('button[type=submit]').prop('disabled',true).html('<i class="fas fa-spinner fa-spin mr-2"></i>Saving...');
    $.ajax({url:'/api/inventory/movements/'+id,method:'PUT',contentType:'application/json',data:JSON.stringify(data),headers:{Authorization:'Bearer '+token}}).done(function(){
        hideEditModal();load($('#product-filter').val());
    }).fail(function(x){alert('Error: '+(x.responseJSON?.detail||'Unknown'));}).always(function(){$('button[type=submit]').prop('disabled',false).html('Save');});
});

$('#product-filter').on('change',function(){load($(this).val());});

$(function(){load();loadProducts();});
</script>
{% endblock %}
