{% extends "base.html" %}
{% block title %}Products - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Products</h1>
            <a href="/products/new" class="bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-cyan-700"><i class="fas fa-plus mr-2"></i>Add Product</a>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex gap-2">
                <input type="text" id="search" class="w-72 px-4 py-2 border rounded-lg text-sm" placeholder="Search products...">
                <select id="cat-filter" class="px-4 py-2 border rounded-lg text-sm"><option value="">All Categories</option><option>hardware</option><option>software</option><option>service</option><option>networking</option></select>
            </div>
            <table class="w-full"><thead class="bg-dptech-50"><tr><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Name</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">SKU</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Category</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Price</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Stock</th><th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Actions</th></tr></thead><tbody id="products-body"></tbody></table>
        </div>
    </main>
</div>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/login';
function load(search='', cat='') {
    let url = '/api/products?';
    if (search) url += 'search='+encodeURIComponent(search)+'&';
    if (cat) url += 'category='+cat+'&';
    $.ajax({url, method:'GET', headers:{Authorization:'Bearer '+token}}).done(function(products) {
        if (!products.length) { $('#products-body').html('<tr><td colspan="6" class="text-center py-8 text-gray-400">No products found</td></tr>'); return; }
        $('#products-body').html(products.map(p => `<tr class="border-b border-gray-50 hover:bg-dptech-50">
            <td class="px-6 py-4 font-medium text-gray-800">${p.name}</td>
            <td class="px-6 py-4 text-gray-500 text-sm">${p.sku || '-'}</td>
            <td class="px-6 py-4"><span class="text-xs px-2 py-1 rounded-full bg-cyan-50 text-cyan-700">${p.category || 'other'}</span></td>
            <td class="px-6 py-4 text-right font-medium">PKR ${Number(p.unit_price || 0).toLocaleString()}</td>
            <td class="px-6 py-4 text-right"><span class="font-medium ${(p.stock_qty||0) <= (p.min_stock_level||0) ? 'text-red-600' : 'text-green-600'}">${p.stock_qty ?? 0}</span> <span class="text-gray-400 text-xs">${p.unit||'pcs'}</span></td>
            <td class="px-6 py-4 text-center flex gap-2 justify-center">
                <a href="/products/new?id=${p.id}" class="text-amber-600 hover:text-amber-800" title="Edit"><i class="fas fa-edit"></i></a>
                <button class="text-red-600 hover:text-red-800 bg-transparent border-0 cursor-pointer delete-product" data-id="${p.id}" data-name="${p.name}" title="Delete"><i class="fas fa-trash"></i></button>
            </td>
        </tr>`).join(''));
    }).fail(function(x){
        $('#products-body').html('<tr><td colspan="6" class="text-center py-8 text-red-400">Failed to load products: '+(x.responseJSON?.detail||x.statusText||'Error')+'</td></tr>');
    });
}
$(document).on('click', '.delete-product', function(e){
    e.preventDefault();
    const id=$(this).data('id'), name=$(this).data('name');
    if(confirm('Deactivate product '+name+'?')){
        $.ajax({url:'/api/products/'+id,method:'DELETE',headers:{Authorization:'Bearer '+token}}).done(function(){load($('#search').val(),$('#cat-filter').val());}).fail(function(x){alert(x.responseJSON?.detail||'Error');});
    }
});
$(function(){load();var to; $('#search').on('keyup',function(){clearTimeout(to); to=setTimeout(function(){load($('#search').val(),$('#cat-filter').val());},300);});$('#cat-filter').on('change',function(){load($('#search').val(),$(this).val());});});
</script>
{% endblock %}
