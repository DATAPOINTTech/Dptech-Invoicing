# Nginx production configuration for DATAPOINT Invoicing System
server {
    listen 80;
    server_name _;
    root /var/www/dptech/php/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 32M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static assets caching
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Favicon
    location = /favicon.ico {
        try_files /static/img/favicon.svg =404;
        access_log off;
        log_not_found off;
    }

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handling
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Adjust socket path as necessary
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Deny access to hidden/sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(db|sqlite|env|log)$ {
        deny all;
    }
}
