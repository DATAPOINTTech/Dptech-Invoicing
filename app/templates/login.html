{% extends "base.html" %}
{% block title %}Login - {{ company }}{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-slate-800 to-cyan-900">
    <div class="w-full max-w-md">
        <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8 mx-4">
            <div class="text-center mb-8">
                <div class="w-24 h-24 mx-auto mb-4">
                    <img src="/static/img/logo.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <h1 class="text-2xl font-bold text-gray-800">{{ company }}</h1>
                <p class="text-gray-500 mt-1">Business Management System</p>
            </div>
            <div id="error-msg" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm"></div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent outline-none transition-all"
                        placeholder="Enter username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent outline-none transition-all"
                        placeholder="Enter password">
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white py-3 rounded-lg font-semibold hover:from-cyan-700 hover:to-blue-700 transition-all shadow-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                </button>
            </form>
            <div class="mt-6 text-center text-xs text-gray-400">
                <p>&copy; 2024 {{ company }}. All rights reserved.</p>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var errEl = document.getElementById('error-msg');
    errEl.classList.add('hidden');
    var formData = new URLSearchParams();
    formData.append('username', document.getElementById('username').value);
    formData.append('password', document.getElementById('password').value);
    fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: formData.toString()
    }).then(function(r) {
        if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Login failed'); });
        return r.json();
    }).then(function(res) {
        localStorage.setItem('token', res.access_token);
        localStorage.setItem('user', JSON.stringify(res.user));
        window.location.href = '/dashboard';
    }).catch(function(err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
    });
});
</script>
{% endblock %}
