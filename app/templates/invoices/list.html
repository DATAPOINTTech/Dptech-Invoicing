{% extends "base.html" %}
{% block title %}Invoices - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Sales Invoices</h1>
            <a href="/invoices/new" class="bg-gradient-to-r from-green-500 to-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:shadow-lg"><i class="fas fa-plus mr-2"></i>New Invoice</a>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex gap-2">
                <select id="status-filter" class="px-4 py-2 border rounded-lg text-sm"><option value="">All Status</option><option value="draft">Draft</option><option value="sent">Sent</option><option value="paid">Paid</option><option value="partially_paid">Partially Paid</option><option value="overdue">Overdue</option></select>
            </div>
            <table class="w-full"><thead class="bg-gray-50"><tr><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Invoice #</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Client</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Date</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Total</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Balance</th><th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Status</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Actions</th></tr></thead><tbody id="invoices-body"></tbody></table>
        </div>
    </main>
</div>
<script>
const token=localStorage.getItem('token');if(!token)window.location.href='/login';
function load(){const s=$('#status-filter').val();$.ajax({url:'/api/invoices'+(s?'?status='+s:''),method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(invs){
    if(!invs.length){$('#invoices-body').html('<tr><td colspan="7" class="text-center py-8 text-gray-400">No invoices</td></tr>');return;}
    $('#invoices-body').html(invs.map(i=>`<tr class="border-b border-gray-50 hover:bg-gray-50">
        <td class="px-6 py-4 font-medium text-gray-800">${i.invoice_no}</td>
        <td class="px-6 py-4">${i.client_name}</td>
        <td class="px-6 py-4 text-sm text-gray-500">${i.invoice_date}</td>
        <td class="px-6 py-4 text-right font-medium">PKR ${i.total_amount?.toLocaleString()}</td>
        <td class="px-6 py-4 text-right ${i.balance_due>0?'text-red-600 font-semibold':'text-green-600'}">PKR ${i.balance_due?.toLocaleString()}</td>
        <td class="px-6 py-4 text-center"><span class="text-xs px-2 py-1 rounded-full ${i.status==='paid'?'bg-green-100 text-green-700':i.status==='sent'?'bg-blue-100 text-blue-700':i.status==='overdue'?'bg-red-100 text-red-700':i.status==='partially_paid'?'bg-amber-100 text-amber-700':'bg-gray-100 text-gray-600'}">${i.status.replace('_',' ')}</span></td>
        <td class="px-6 py-4 text-right"><a href="/invoices/${i.id}" class="text-cyan-600 hover:text-cyan-800 text-sm"><i class="fas fa-eye mr-1"></i>View</a></td>
    </tr>`).join('');
});}
$(function(){load();$('#status-filter').on('change',load);});
</script>
{% endblock %}
