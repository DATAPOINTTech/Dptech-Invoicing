{% extends "base.html" %}
{% block title %}Purchases - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Purchase Invoices</h1>
            <a href="/purchases/new" class="bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-cyan-700"><i class="fas fa-plus mr-2"></i>New Purchase</a>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full"><thead class="bg-gray-50"><tr><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Invoice #</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Supplier</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Date</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Total</th><th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Status</th></tr></thead><tbody id="purchases-body"></tbody></table>
        </div>
    </main>
</div>
<script>
const token=localStorage.getItem('token');if(!token)window.location.href='/login';
$.ajax({url:'/api/purchases',method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(ps){
    if(!ps.length){$('#purchases-body').html('<tr><td colspan="5" class="text-center py-8 text-gray-400">No purchases</td></tr>');return;}
    $('#purchases-body').html(ps.map(p=>`<tr class="border-b border-gray-50 hover:bg-gray-50">
        <td class="px-6 py-4 font-medium text-gray-800">${p.invoice_no}</td>
        <td class="px-6 py-4">${p.supplier_name}</td>
        <td class="px-6 py-4 text-gray-500 text-sm">${p.invoice_date}</td>
        <td class="px-6 py-4 text-right font-medium">PKR ${p.total_amount?.toLocaleString()}</td>
        <td class="px-6 py-4 text-center"><span class="text-xs px-2 py-1 rounded-full ${p.status==='received'?'bg-green-100 text-green-700':'bg-gray-100 text-gray-600'}">${p.status}</span></td>
    </tr>`).join(''));
});
</script>
{% endblock %}
