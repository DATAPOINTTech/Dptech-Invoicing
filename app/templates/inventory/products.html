{% extends "base.html" %}
{% block title %}Products - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Products</h1>
            <a href="/products/new" class="bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-cyan-700"><i class="fas fa-plus mr-2"></i>Add Product</a>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex gap-2">
                <input type="text" id="search" class="w-72 px-4 py-2 border rounded-lg text-sm" placeholder="Search products...">
                <select id="cat-filter" class="px-4 py-2 border rounded-lg text-sm"><option value="">All Categories</option><option>hardware</option><option>software</option><option>service</option><option>networking</option></select>
            </div>
            <table class="w-full"><thead class="bg-gray-50"><tr><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Name</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">SKU</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Category</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Price</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Stock</th><th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Actions</th></tr></thead><tbody id="products-body"></tbody></table>
        </div>
    </main>
</div>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/login';
function load(search='', cat='') {
    let url = '/api/products?';
    if (search) url += 'search='+encodeURIComponent(search)+'&';
    if (cat) url += 'category='+cat+'&';
    $.ajax({url, method:'GET', headers:{Authorization:'Bearer '+token}}).done(function(products) {
        if (!products.length) { $('#products-body').html('<tr><td colspan="6" class="text-center py-8 text-gray-400">No products found</td></tr>'); return; }
        $('#products-body').html(products.map(p => `<tr class="border-b border-gray-50 hover:bg-gray-50">
            <td class="px-6 py-4 font-medium text-gray-800">${p.name}</td>
            <td class="px-6 py-4 text-gray-500 text-sm">${p.sku || '-'}</td>
            <td class="px-6 py-4"><span class="text-xs px-2 py-1 rounded-full bg-cyan-50 text-cyan-700">${p.category || 'other'}</span></td>
            <td class="px-6 py-4 text-right font-medium">PKR ${p.unit_price?.toLocaleString()}</td>
            <td class="px-6 py-4 text-right"><span class="font-medium ${p.stock_qty <= p.min_stock_level ? 'text-red-600' : 'text-green-600'}">${p.stock_qty}</span> <span class="text-gray-400 text-xs">${p.unit}</span></td>
            <td class="px-6 py-4 text-center"><a href="/products/new?id=${p.id}" class="text-cyan-600 hover:text-cyan-800"><i class="fas fa-edit"></i></a></td>
        </tr>`).join('');
    });
}
$(function(){load();$('#search').on('keyup',function(){load($(this).val(),$('#cat-filter').val());});$('#cat-filter').on('change',function(){load($('#search').val(),$(this).val());});});
</script>
{% endblock %}
