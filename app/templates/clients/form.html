{% extends "base.html" %}
{% block title %}Client - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">{% if request.query_params.id %}Edit{% else %}New{% endif %} Client</h1>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 max-w-2xl">
            <form id="client-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium text-gray-700">Name *</label><input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></div>
                    <div><label class="block text-sm font-medium text-gray-700">Company</label><input type="text" id="company" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></div>
                    <div><label class="block text-sm font-medium text-gray-700">Email</label><input type="email" id="email" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></div>
                    <div><label class="block text-sm font-medium text-gray-700">Phone</label><input type="text" id="phone" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></div>
                    <div><label class="block text-sm font-medium text-gray-700">Mobile</label><input type="text" id="mobile" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></div>
                    <div><label class="block text-sm font-medium text-gray-700">City</label><input type="text" id="city" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></div>
                    <div><label class="block text-sm font-medium text-gray-700">Province</label><input type="text" id="province" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></div>
                    <div><label class="block text-sm font-medium text-gray-700">NTN</label><input type="text" id="ntn" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></div>
                    <div class="col-span-2"><label class="block text-sm font-medium text-gray-700">STRN</label><input type="text" id="strn" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></div>
                    <div class="col-span-2"><label class="block text-sm font-medium text-gray-700">Address</label><textarea id="address" rows="2" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></textarea></div>
                    <div class="col-span-2"><label class="block text-sm font-medium text-gray-700">Notes</label><textarea id="notes" rows="2" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 outline-none mt-1"></textarea></div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="bg-cyan-600 text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-cyan-700"><i class="fas fa-save mr-2"></i>Save</button>
                    <a href="/clients" class="bg-gray-100 text-gray-700 px-6 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-200">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/login';
const urlParams = new URLSearchParams(window.location.search);
const editId = urlParams.get('id');
if (editId) { $.ajax({url: '/api/clients/'+editId, method:'GET', headers:{Authorization:'Bearer '+token}}).done(function(c) { $('#name').val(c.name);$('#company').val(c.company);$('#email').val(c.email);$('#phone').val(c.phone);$('#mobile').val(c.mobile);$('#city').val(c.city);$('#province').val(c.province);$('#ntn').val(c.ntn);$('#strn').val(c.strn);$('#address').val(c.address);$('#notes').val(c.notes); }); }
$('#client-form').submit(function(e) {
    e.preventDefault();
    const data = {name:$('#name').val(),company:$('#company').val(),email:$('#email').val(),phone:$('#phone').val(),mobile:$('#mobile').val(),city:$('#city').val(),province:$('#province').val(),ntn:$('#ntn').val(),strn:$('#strn').val(),address:$('#address').val(),notes:$('#notes').val()};
    const method = editId ? 'PUT' : 'POST';
    const url = editId ? '/api/clients/'+editId : '/api/clients';
    $.ajax({url, method, contentType:'application/json', data:JSON.stringify(data), headers:{Authorization:'Bearer '+token}}).done(function(){window.location.href='/clients';}).fail(function(x){alert('Error: '+(x.responseJSON?.detail||'Unknown'));});
});
</script>
{% endblock %}
