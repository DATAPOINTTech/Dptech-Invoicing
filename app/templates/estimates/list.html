{% extends "base.html" %}
{% block title %}Estimates - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-6">
        <div class="flex justify-between items-center mb-5">
            <h1 class="page-title">Estimates / Quotations</h1>
            <a href="/estimates/new" class="btn btn-primary"><i class="fas fa-plus"></i> New Estimate</a>
        </div>
        <div class="card overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-100 flex gap-3">
                <select id="status-filter" class="px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-500"><option value="">All Status</option><option value="draft">Draft</option><option value="sent">Sent</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="converted">Converted</option></select>
            </div>
            <div class="table-container">
            <table class="data-table"><thead><tr><th>Estimate #</th><th>Client</th><th>Date</th><th class="text-right">Total</th><th class="text-center">Status</th><th class="text-right">Actions</th></tr></thead><tbody id="estimates-body"></tbody></table>
            </div>
        </div>
    </main>
</div>
<script>
const token=localStorage.getItem('token');if(!token)window.location.href='/login';
function load(){const s=$('#status-filter').val();$.ajax({url:'/api/estimates'+(s?'?status='+s:''),method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(ests){
    const statusBadge=s=>{const m={approved:'badge-green',sent:'badge-blue',converted:'badge-purple',rejected:'badge-red',draft:'badge-gray',expired:'badge-amber'};return `<span class="badge ${m[s]||'badge-gray'}">${s}</span>`;};
    if(!ests.length){$('#estimates-body').html('<tr><td colspan="6" class="text-center py-8 text-slate-400">No estimates found</td></tr>');return;}
    $('#estimates-body').html(ests.map(e=>`<tr>
        <td class="font-medium text-slate-800">${e.estimate_no}</td>
        <td>${e.client_name}</td>
        <td class="text-slate-500">${e.estimate_date}</td>
        <td class="text-right font-medium">PKR ${e.total_amount?.toLocaleString()}</td>
        <td class="text-center">${statusBadge(e.status)}</td>
        <td class="text-right">
            <div class="flex gap-2 justify-end">
            <a href="/estimates/${e.id}" class="btn btn-ghost btn-sm" title="View"><i class="fas fa-eye"></i></a>
            <a href="/estimates/${e.id}/edit" class="btn btn-ghost btn-sm" title="Edit"><i class="fas fa-pen"></i></a>
            ${e.status==='rejected'?
                `<button class="btn btn-ghost btn-sm text-red-500 delete-estimate" data-id="${e.id}" data-no="${e.estimate_no}" title="Delete"><i class="fas fa-trash"></i></button>`:
                `<button class="btn btn-ghost btn-sm text-red-500 reject-estimate" data-id="${e.id}" data-no="${e.estimate_no}" title="Reject"><i class="fas fa-times"></i></button>`
            }
            </div>
        </td>
    </tr>`).join(''));
}).fail(function(x){
    $('#estimates-body').html('<tr><td colspan="6" class="text-center py-8 text-red-400">Failed to load estimates: '+(x.responseJSON?.detail||x.statusText||'Error')+'</td></tr>');
});}
$(document).on('click', '.reject-estimate', function(e){
    e.preventDefault();
    const id=$(this).data('id'), no=$(this).data('no');
    if(confirm('Reject estimate '+no+'? It can be deleted after rejection.')){
        $.ajax({url:'/api/estimates/'+id+'/reject',method:'POST',headers:{Authorization:'Bearer '+token}}).done(function(){load();}).fail(function(x){alert(x.responseJSON?.detail||'Error');});
    }
});
$(document).on('click', '.delete-estimate', function(e){
    e.preventDefault();
    const id=$(this).data('id'), no=$(this).data('no');
    if(confirm('Permanently delete rejected estimate '+no+'?')){
        $.ajax({url:'/api/estimates/'+id,method:'DELETE',headers:{Authorization:'Bearer '+token}}).done(function(){load();}).fail(function(x){alert(x.responseJSON?.detail||'Error');});
    }
});
$(function(){load();$('#status-filter').on('change',load);});
</script>
{% endblock %}
