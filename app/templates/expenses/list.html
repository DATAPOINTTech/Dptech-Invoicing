{% extends "base.html" %}
{% block title %}Expenses - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Expenses</h1>
            <a href="/expenses/new" class="bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-cyan-700"><i class="fas fa-plus mr-2"></i>Add Expense</a>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-xl p-4 shadow-sm border"><p class="text-sm text-gray-500">Total Expenses</p><h3 class="text-xl font-bold" id="exp-total">PKR 0</h3></div>
            <div class="bg-white rounded-xl p-4 shadow-sm border"><p class="text-sm text-gray-500">Count</p><h3 class="text-xl font-bold" id="exp-count">0</h3></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex gap-2">
                <select id="cat-filter" class="px-4 py-2 border rounded-lg text-sm"><option value="">All Categories</option><option value="utilities">Utilities</option><option value="rent">Rent</option><option value="salary">Salary</option><option value="transport">Transport</option><option value="office_supplies">Office Supplies</option><option value="other">Other</option></select>
                <input type="date" id="from-date" class="px-4 py-2 border rounded-lg text-sm">
                <input type="date" id="to-date" class="px-4 py-2 border rounded-lg text-sm">
            </div>
            <table class="w-full"><thead class="bg-dptech-50"><tr><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">#</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Description</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Category</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Date</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Amount</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Actions</th></tr></thead><tbody id="expenses-body"></tbody></table>
        </div>
    </main>
</div>
<script>
const token=localStorage.getItem('token');if(!token)window.location.href='/login';
function load(){const cat=$('#cat-filter').val(),from=$('#from-date').val(),to=$('#to-date').val();let url='/api/expenses?';if(cat)url+='category='+cat+'&';if(from)url+='from_date='+from+'&';if(to)url+='to_date='+to+'&';
    $.ajax({url,method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(exps){
        if(!exps.length){$('#expenses-body').html('<tr><td colspan="5" class="text-center py-8 text-gray-400">No expenses</td></tr>');return;}
        let total=0;
        $('#expenses-body').html(exps.map(e=>{total+=e.total_amount;return `<tr class="border-b border-gray-50 hover:bg-dptech-50"><td class="px-6 py-4 text-sm text-gray-500">${e.expense_no||'-'}</td><td class="px-6 py-4 font-medium">${e.description}</td><td class="px-6 py-4"><span class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-700">${e.category?.replace('_',' ')||'other'}</span></td><td class="px-6 py-4 text-sm text-gray-500">${e.expense_date}</td><td class="px-6 py-4 text-right font-medium">PKR ${e.total_amount?.toLocaleString()}</td><td class="px-6 py-4 text-right"><a href="/expenses/${e.id}" class="text-amber-600 hover:text-amber-800 text-sm mr-2" title="Edit"><i class="fas fa-edit"></i></a><button class="text-red-600 hover:text-red-800 text-sm bg-transparent border-0 cursor-pointer delete-expense" data-id="${e.id}" data-no="${e.expense_no}" title="Delete"><i class="fas fa-trash"></i></button></td></tr>`;}).join(''));
        $('#exp-total').text('PKR '+total.toLocaleString());$('#exp-count').text(exps.length);
    }).fail(function(x){
        $('#expenses-body').html('<tr><td colspan="5" class="text-center py-8 text-red-400">Failed to load expenses: '+(x.responseJSON?.detail||x.statusText||'Error')+'</td></tr>');
    });
}
$(document).on('click', '.delete-expense', function(e){
    e.preventDefault();
    const id=$(this).data('id'), no=$(this).data('no');
    if(confirm('Delete expense '+no+'?')){
        $.ajax({url:'/api/expenses/'+id,method:'DELETE',headers:{Authorization:'Bearer '+token}}).done(function(){load();}).fail(function(x){alert(x.responseJSON?.detail||'Error');});
    }
});
$(function(){load();$('#cat-filter,#from-date,#to-date').on('change',load);});
</script>
{% endblock %}
