{% extends "base.html" %}
{% block title %}Users - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-6">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Users</h1>
                <p class="text-gray-500">Manage system users and roles</p>
            </div>
            <button onclick="showCreateModal()" class="bg-gradient-to-r from-cyan-500 to-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:shadow-lg">
                <i class="fas fa-plus mr-2"></i>Add User
            </button>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full">
                <thead class="bg-dptech-50">
                    <tr>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Full Name</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Username</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Email</th>
                        <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Role</th>
                        <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Status</th>
                        <th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-body"></tbody>
            </table>
        </div>
    </main>
</div>

<div id="create-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-gray-800">Add New User</h3>
            <button onclick="hideCreateModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>
        <form id="create-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="new-full_name" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="new-username" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="new-email" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                <input type="text" id="new-phone" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="new-password" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                <select id="new-role" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent outline-none text-sm">
                    <option value="staff">Staff</option>
                    <option value="manager">Manager</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white py-2.5 rounded-lg font-semibold hover:shadow-lg text-sm">
                Create User
            </button>
        </form>
    </div>
</div>
<script>
function getToken() { return localStorage.getItem('token'); }
function showCreateModal() { document.getElementById('create-modal').classList.remove('hidden'); document.getElementById('create-modal').classList.add('flex'); }
function hideCreateModal() { document.getElementById('create-modal').classList.add('hidden'); document.getElementById('create-modal').classList.remove('flex'); }

$(function() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const token = getToken();
    if (!token || user.role !== 'admin') { window.location.href = '/dashboard'; return; }

    function loadUsers() {
        $.ajax({url: '/api/users', headers: {Authorization: 'Bearer ' + token}})
        .done(function(users) {
            let html = users.map(u => `
                <tr class="border-b border-gray-50 hover:bg-dptech-50">
                    <td class="px-6 py-4 font-medium text-gray-800">${u.full_name}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${u.username}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${u.email}</td>
                    <td class="px-6 py-4"><span class="text-xs px-2 py-1 rounded-full ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : u.role === 'manager' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-700'} font-medium">${u.role}</span></td>
                    <td class="px-6 py-4 text-center">
                        <span class="text-xs px-2 py-1 rounded-full ${u.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${u.is_active ? 'Active' : 'Inactive'}</span>
                    </td>
                    <td class="px-6 py-4 text-right space-x-2">
                        ${u.role === 'staff' ? `<button class="text-indigo-600 hover:text-indigo-800 text-sm bg-transparent border-0 cursor-pointer open-perms" data-id="${u.id}" data-name="${u.full_name}"><i class="fas fa-shield-alt mr-1"></i>Permissions</button>` : ''}
                        ${u.is_active ? `<button class="text-red-600 hover:text-red-800 text-sm bg-transparent border-0 cursor-pointer toggle-status" data-id="${u.id}" data-active="${u.is_active}"><i class="fas fa-ban mr-1"></i>Deactivate</button>` : `<button class="text-green-600 hover:text-green-800 text-sm bg-transparent border-0 cursor-pointer toggle-status" data-id="${u.id}" data-active="${u.is_active}"><i class="fas fa-check mr-1"></i>Activate</button>`}
                    </td>
                </tr>`).join('');
            $('#users-body').html(html || '<tr><td colspan="6" class="text-center py-8 text-gray-400">No users found</td></tr>');
        }).fail(function() { window.location.href = '/login'; });
    }

    loadUsers();

    $('#create-form').submit(function(e) {
        e.preventDefault();
        const data = {
            full_name: $('#new-full_name').val(),
            username: $('#new-username').val(),
            email: $('#new-email').val(),
            phone: $('#new-phone').val(),
            password: $('#new-password').val(),
            role: $('#new-role').val()
        };
        $.ajax({url: '/api/auth/register', method: 'POST', contentType: 'application/json', data: JSON.stringify(data), headers: {Authorization: 'Bearer ' + token}})
        .done(function() {
            hideCreateModal();
            $('#create-form')[0].reset();
            loadUsers();
        }).fail(function(xhr) {
            const msg = xhr.responseJSON?.detail || 'Failed to create user';
            alert(msg);
        });
    });

    $(document).on('click', '.toggle-status', function() {
        const id = $(this).data('id');
        const active = $(this).data('active');
        if (!confirm((active ? 'Deactivate' : 'Activate') + ' this user?')) return;
        $.ajax({url: '/api/users/' + id + '/status', method: 'PUT', contentType: 'application/json', data: JSON.stringify({is_active: !active}), headers: {Authorization: 'Bearer ' + token}})
        .done(function() { loadUsers(); })
        .fail(function(xhr) { alert(xhr.responseJSON?.detail || 'Failed to update status'); });
    });

    const MODULES = ['invoices','estimates','purchases','expenses','clients','suppliers','products','inventory','projects','reports','users'];
    const ACTIONS = ['view','create','edit','delete'];
    let permsUserId = null;

    $(document).on('click', '.open-perms', function() {
        permsUserId = $(this).data('id');
        $('#perms-title').text('Permissions — ' + $(this).data('name'));
        $.ajax({url: '/api/users/' + permsUserId + '/permissions', headers: {Authorization: 'Bearer ' + token}})
        .done(function(data) {
            let rows = MODULES.map(mod => {
                let cells = ACTIONS.map(act => {
                    const checked = data.permissions[mod]?.[act] ? 'checked' : '';
                    return `<td class="text-center px-3 py-2"><input type="checkbox" class="perm-cb w-4 h-4 accent-cyan-500" data-mod="${mod}" data-act="${act}" ${checked}></td>`;
                }).join('');
                return `<tr class="border-b border-gray-100 hover:bg-slate-50"><td class="px-3 py-2 text-sm font-medium text-gray-700 capitalize">${mod}</td>${cells}</tr>`;
            }).join('');
            $('#perms-body').html(rows);
            $('#perms-modal').removeClass('hidden').addClass('flex');
        });
    });

    $('#perms-save').click(function() {
        const permissions = {};
        MODULES.forEach(mod => {
            permissions[mod] = {};
            ACTIONS.forEach(act => {
                permissions[mod][act] = $(`.perm-cb[data-mod="${mod}"][data-act="${act}"]`).is(':checked');
            });
        });
        $.ajax({url: '/api/users/' + permsUserId + '/permissions', method: 'PUT', contentType: 'application/json', data: JSON.stringify({permissions}), headers: {Authorization: 'Bearer ' + token}})
        .done(function() {
            $('#perms-modal').addClass('hidden').removeClass('flex');
        }).fail(function(xhr) { alert(xhr.responseJSON?.detail || 'Failed to save permissions'); });
    });

    $('#perms-close').click(function() { $('#perms-modal').addClass('hidden').removeClass('flex'); });
});
</script>

<div id="perms-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-2xl mx-4 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h3 id="perms-title" class="text-lg font-bold text-gray-800">Permissions</h3>
            <button id="perms-close" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-50">
                        <th class="text-left px-3 py-2 text-xs font-semibold text-gray-500 uppercase">Module</th>
                        <th class="text-center px-3 py-2 text-xs font-semibold text-gray-500 uppercase">View</th>
                        <th class="text-center px-3 py-2 text-xs font-semibold text-gray-500 uppercase">Create</th>
                        <th class="text-center px-3 py-2 text-xs font-semibold text-gray-500 uppercase">Edit</th>
                        <th class="text-center px-3 py-2 text-xs font-semibold text-gray-500 uppercase">Delete</th>
                    </tr>
                </thead>
                <tbody id="perms-body"></tbody>
            </table>
        </div>
        <div class="flex justify-end gap-3 mt-5">
            <button onclick="$('#perms-modal').addClass('hidden').removeClass('flex')" class="px-4 py-2 text-sm text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</button>
            <button id="perms-save" class="px-5 py-2 text-sm bg-gradient-to-r from-cyan-500 to-blue-500 text-white rounded-lg font-semibold hover:shadow-lg">Save Permissions</button>
        </div>
    </div>
</div>
{% endblock %}
