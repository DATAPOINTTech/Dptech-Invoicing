                <p class="text-slate-200 text-sm font-medium truncate" id="sidebar-username">User</p>

            </div>

        </a>
    </div>
</aside>

<script>
$(function() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.role === 'admin') $('#nav-users').show();
    if (user.name) {
        $('#sidebar-username').text(user.name);
        $('#sidebar-avatar').text(user.name.charAt(0).toUpperCase());
    }
    if (user.role) $('#sidebar-role').text(user.role.charAt(0).toUpperCase() + user.role.slice(1));

    const path = window.location.pathname;
    $('.nav-item').each(function() {
        const href = $(this).attr('href');
        if (href && href !== '#' && href !== '/login' && (path === href || path.startsWith(href + '/'))) {
            $(this).addClass('sidebar-active');
            $(this).find('i').css('color', '#fff');
        }
    });

    $('#logout-btn').click(function() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
    });
});
</script>
