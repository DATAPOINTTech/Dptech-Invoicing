{% extends "base.html" %}
{% block title %}Projects - {{ company }}{% endblock %}
{% block content %}
<div class="flex min-h-screen">
    {% include "includes/sidebar.html" %}
    <main class="flex-1 ml-64 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Projects</h1>
            <button onclick="showProjectModal()" class="bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-cyan-700"><i class="fas fa-plus mr-2"></i>New Project</button>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full"><thead class="bg-gray-50"><tr><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Name</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Client</th><th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Dates</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Budget</th><th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Status</th><th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Actions</th></tr></thead><tbody id="projects-body"></tbody></table>
        </div>
    </main>
</div>
<div id="project-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"><div class="bg-white rounded-xl p-6 w-[500px]">
    <h3 class="font-bold text-lg mb-4" id="modal-title">New Project</h3>
    <form id="project-form" class="space-y-3">
        <input type="hidden" id="pid" value="">
        <div><label class="block text-sm text-gray-600">Name *</label><input type="text" id="pname" required class="w-full px-3 py-2 border rounded-lg text-sm"></div>
        <div><label class="block text-sm text-gray-600">Client</label><select id="pclient" class="w-full px-3 py-2 border rounded-lg text-sm"><option value="">None</option></select></div>
        <div class="grid grid-cols-2 gap-3"><div><label class="block text-sm text-gray-600">Start Date</label><input type="date" id="pstart" class="w-full px-3 py-2 border rounded-lg text-sm"></div><div><label class="block text-sm text-gray-600">End Date</label><input type="date" id="pend" class="w-full px-3 py-2 border rounded-lg text-sm"></div></div>
        <div><label class="block text-sm text-gray-600">Budget (PKR)</label><input type="number" step="0.01" id="pbudget" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
        <div><label class="block text-sm text-gray-600">Description</label><textarea id="pdesc" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm"></textarea></div>
        <div><label class="block text-sm text-gray-600">Status</label><select id="pstatus" class="w-full px-3 py-2 border rounded-lg text-sm"><option value="planning">Planning</option><option value="in_progress">In Progress</option><option value="on_hold">On Hold</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
        <div class="flex gap-2 pt-2"><button type="submit" class="bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Save</button><button type="button" onclick="hideProjectModal()" class="bg-gray-100 px-4 py-2 rounded-lg text-sm">Cancel</button></div>
    </form>
</div></div>
<script>
const token=localStorage.getItem('token');if(!token)window.location.href='/login';
function load(){$.ajax({url:'/api/projects',method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(ps){
    if(!ps.length){$('#projects-body').html('<tr><td colspan="6" class="text-center py-8 text-gray-400">No projects</td></tr>');return;}
    const sc={'planning':'bg-gray-100 text-gray-600','in_progress':'bg-blue-100 text-blue-700','on_hold':'bg-amber-100 text-amber-700','completed':'bg-green-100 text-green-700','cancelled':'bg-red-100 text-red-700'};
    $('#projects-body').html(ps.map(p=>`<tr class="border-b border-gray-50 hover:bg-gray-50">
        <td class="px-6 py-4 font-medium">${p.name}</td>
        <td class="px-6 py-4 text-gray-600">${p.client?.name||'-'}</td>
        <td class="px-6 py-4 text-sm text-gray-500">${p.start_date||'-'} → ${p.end_date||'-'}</td>
        <td class="px-6 py-4 text-right font-medium">PKR ${(p.budget||0).toLocaleString()}</td>
        <td class="px-6 py-4 text-center"><span class="text-xs px-2 py-1 rounded-full ${sc[p.status]||'bg-gray-100'}">${p.status?.replace('_',' ')}</span></td>
        <td class="px-6 py-4 text-right">
            <button onclick="editProject(${p.id})" class="text-amber-600 hover:text-amber-800 text-sm mr-2 bg-transparent border-0 cursor-pointer" title="Edit"><i class="fas fa-edit"></i></button>
            <button class="text-red-600 hover:text-red-800 text-sm bg-transparent border-0 cursor-pointer cancel-project" data-id="${p.id}" data-name="${p.name}" title="Cancel"><i class="fas fa-times"></i></button>
        </td>
    </tr>`).join(''));
});}
function showProjectModal(){$('#modal-title').text('New Project');$('#pid').val('');$('#project-form')[0].reset();$('#pstatus').val('planning');$('#project-modal').removeClass('hidden').addClass('flex');}
function hideProjectModal(){$('#project-modal').removeClass('flex').addClass('hidden');}
function editProject(id){
    $.ajax({url:'/api/projects/'+id,method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(p){
        $('#modal-title').text('Edit Project');$('#pid').val(p.id);
        $('#pname').val(p.name);$('#pclient').val(p.client_id||'');$('#pstart').val(p.start_date||'');$('#pend').val(p.end_date||'');
        $('#pbudget').val(p.budget||0);$('#pdesc').val(p.description||'');$('#pstatus').val(p.status||'planning');
        $('#project-modal').removeClass('hidden').addClass('flex');
    });
}
$(document).on('click', '.cancel-project', function(e){
    e.preventDefault();
    const id=$(this).data('id'), name=$(this).data('name');
    if(confirm('Cancel project '+name+'?')){
        $.ajax({url:'/api/projects/'+id,method:'DELETE',headers:{Authorization:'Bearer '+token}}).done(function(){load();}).fail(function(x){alert(x.responseJSON?.detail||'Error');});
    }
});
$(function(){
    load();
    $.ajax({url:'/api/clients',method:'GET',headers:{Authorization:'Bearer '+token}}).done(function(cs){cs.forEach(c=>{$('#pclient').append(`<option value="${c.id}">${c.name}</option>`);});});
    $('#project-form').submit(function(e){e.preventDefault();
        const data={name:$('#pname').val(),client_id:parseInt($('#pclient').val())||null,start_date:$('#pstart').val()||null,end_date:$('#pend').val()||null,budget:parseFloat($('#pbudget').val())||0,description:$('#pdesc').val()};
        const id=$('#pid').val();
        const url=id?'/api/projects/'+id:'/api/projects';
        const method=id?'PUT':'POST';
        $.ajax({url:url,method:method,contentType:'application/json',data:JSON.stringify(data),headers:{Authorization:'Bearer '+token}}).done(function(){hideProjectModal();load();}).fail(function(x){alert(x.responseJSON?.detail||'Error');});
    });
});
</script>
{% endblock %}
