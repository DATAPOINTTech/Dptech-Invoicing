services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dptech_invoicing_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      # Set these in your shell or a .env file next to this file (never commit real values)
      - COMPANY_NAME=${COMPANY_NAME:-Your Company Name}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a long random value (32+ characters)}
      - DATABASE_URL=sqlite:///./storage/dptech.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to a strong password (8+ characters)}
    volumes:
      - ./php/storage:/var/www/html/php/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
